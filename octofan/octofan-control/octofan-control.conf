# octofan-control configuration
# Copy to /etc/octofan-control.conf and edit per host.
# PWM values are 0-255. Temperatures are degrees C.
#
# NUMBERING LANDMINE (MINERDUDE 12XTREME): case fans count LEFT to RIGHT
# facing the rig; PCIe slots count RIGHT to LEFT (slot 1 = rightmost).
# Fan->header wiring must be blip-verified once per chassis (see
# FAN-MAPPING.md); rigs have arrived with non-stock wiring.

[controller]
cli = /usr/local/bin/fan_controller_cli
poll_seconds = 5
step_hysteresis = 2
floor_pwm = 38

# Physical fan name -> controller channel, verified by blip pass.
[fans]
FAN1 = 8
FAN2 = 6
FAN3 = 4
FAN4 = 2
FAN5 = 0

# Slot -> covering fan(s). Comma-separated. "FAN3@0.75, FAN4@0.75" means a
# bridge slot between two fans: both run at 75% of curve duty (floored at
# floor_pwm). Motherboard slots are MB1/MB2; daughterboard slots DB1-DB10
# in the right-to-left convention (DB1 = rightmost daughterboard slot).
[slots]
MB1 = FAN5
MB2 = FAN5
DB1 = FAN4
DB2 = FAN4
DB3 = FAN3@0.75, FAN4@0.75
DB4 = FAN3
DB5 = FAN3
DB6 = FAN2@0.75, FAN3@0.75
DB7 = FAN2
DB8 = FAN2
DB9 = FAN1@0.75, FAN2@0.75
DB10 = FAN1

# Occupied slots (comma-separated). Fans covering these follow the card
# curve; everything else sits at the background floor.
[cards]
slots = DB1

# Temperature sources: hwmon name(s) and sensor files within each hwmon.
# AMD dual-die example (one card, two hwmons): amdgpu + edge/junction.
# NVIDIA example: nvidia (driver "nvidia") + temp1_input.
[sensors]
hwmon_names = amdgpu
sensors = temp1_input, temp2_input

[curves]
# card_steps: up to temperature:pwm pairs, ascending. Above the last
# bound, card_max_pwm applies.
card_steps = 40:38, 50:64, 60:102, 70:153, 80:204, 90:230
card_max_pwm = 255
# Background fans: quiet floor until 70C, then a mild ramp (capped).
background_steps = 70:38, 80:64, 90:102
background_max_pwm = 153
